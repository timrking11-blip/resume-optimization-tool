<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  /* The source template (TIM KING SOURCE RESUME.docx): Letter, 0.5in top/bottom and 0.625in side margins,
     Calibri 10pt, navy headings over a grey rule. Word's single line spacing for Calibri is 1.2207 em. */
  @page { size: Letter; margin: 0.5in 0.625in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-size: 10pt; line-height: 1.2207; color: #000; background: #fff;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 7.25in; margin: 0 auto; }
  p { margin: 0; }
  a { color: #0000FF; text-decoration: underline; }
  .k-name { text-align: center; margin-bottom: 2pt; }
  .k-contact { text-align: center; margin-bottom: 10pt; color: #444444; }
  .k-heading { margin: 12pt 0 5pt; padding-bottom: 2pt; border-bottom: 0.75pt solid #999999; break-after: avoid; }
  .k-tagline, .k-expertise { text-align: center; margin-bottom: 5pt; }
  .k-tech_label { text-align: center; break-after: avoid; }
  .k-tech_line { text-align: center; }
  .k-school { margin-bottom: 1pt; break-after: avoid; }
  .k-degree { margin-bottom: 5pt; }
  .k-role_header { display: flex; justify-content: space-between; align-items: baseline; gap: 12pt; break-after: avoid; }
  .k-role_header .dt { white-space: nowrap; }
  .k-role_context { margin-bottom: 5pt; line-height: 1.4038; break-after: avoid; }
  .k-bullet, .k-bullet_last, .k-comp { position: relative; padding-left: 18pt; }
  .k-bullet::before, .k-bullet_last::before, .k-comp::before { content: "\2022"; position: absolute; left: 0; }
  .k-bullet_last { margin-bottom: 12pt; }
  .k-comp { line-height: 1.2716; }
  .k-cert, .k-eng_bullet, .k-eng_bullet_last { position: relative; padding-left: 15.1pt; margin-bottom: 2pt; line-height: 1.2716; }
  .k-cert::before, .k-eng_bullet::before, .k-eng_bullet_last::before { content: "\2022"; position: absolute; left: 4.35pt; }
  .k-eng_bullet_last { margin-bottom: 8pt; }
  .k-eng_header, .k-eng_subtitle { margin-bottom: 4pt; break-after: avoid; }
  @media screen { body { background: #e9e9e9; } .page { background: #fff; box-shadow: 0 0 8px rgba(0,0,0,.15); margin: 18px auto; padding: 0.5in 0.625in; width: 8.5in; } }
</style>
</head>
<body>
<div class="page">
{{body}}
</div>
</body>
</html>
